[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[project]
name = "partitiondb"
version = "0.2.0a39"
description = "Explicit PostgreSQL tenant scopes with optional framework adapters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jonny Doyle" }]
dependencies = []

[project.optional-dependencies]
celery = ["celery>=5.6,<5.7"]
django = ["Django>=5.2,<6.2", "psycopg[binary]>=3.2,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
testing = ["pytest>=8,<10"]
dev = [
    "celery>=5.6,<5.7",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff==0.17.1",
    "mypy>=1.15,<2",
    "build>=1.2,<2",
]

[tool.hatch.build.targets.sdist]
exclude = ["/dist", "/release_reports", "/.codex", "**/.secrets"]

[tool.hatch.build.targets.wheel]
packages = ["src/partitiondb"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/partitiondb/tenancy/identity.py",
    "src/partitiondb/tenancy/contracts.py",
    "src/partitiondb/tenancy/keys.py",
    "src/partitiondb/tenancy/jobs.py",
    "src/partitiondb/provisioning/__init__.py",
    "src/partitiondb/provisioning/fleet.py",
    "src/partitiondb/tenancy/domains.py",
    "src/partitiondb/provisioning/events.py",
]

[tool.pytest.ini_options]
markers = ["postgres: requires PARTITIONDB_TEST_DSN", "openbao: requires disposable PARTITIONDB_OPENBAO_TEST_ADDR"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["partitiondb", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/test_django.py" = ["E402"]
"tests/test_identity_cache.py" = ["E402"]
[dependency-groups]
dev = [
    "django (>=6.1.2,<7.0.0) ; python_version >= \"3.12\"",
    "psycopg[binary] (>=3.3.6,<4.0.0)"
]
