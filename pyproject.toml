[project]
name = "partitiondb"
version = "0.1.0"
description = "Partitioned database backend for Django multi-tenancy"
authors = [{ name = "Jonny Doyle", email = "jonnydoyle23@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "partitiondb"}
]
