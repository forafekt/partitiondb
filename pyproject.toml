[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[project]
name = "partitiondb"
version = "0.2.0a34"
description = "Explicit PostgreSQL tenant scopes with optional framework adapters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
authors = [{ name = "Jonny Doyle" }]
dependencies = []

[project.optional-dependencies]
celery = ["celery>=5.6,<5.7"]
django = ["Django>=5.2,<6.2", "psycopg[binary]>=3.2,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
testing = ["pytest>=8,<10"]
dev = [
    "celery>=5.6,<5.7",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff==0.17.1",
    "mypy>=1.15,<2",
    "build>=1.2,<2",
]

[tool.hatch.build.targets.sdist]
exclude = ["/dist", "/release_reports"]

[tool.hatch.build.targets.wheel]
packages = ["src/partitiondb"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/partitiondb/core.py",
    "src/partitiondb/contracts.py",
    "src/partitiondb/keys.py",
    "src/partitiondb/jobs.py",
    "src/partitiondb/provisioning.py",
    "src/partitiondb/fleet.py",
    "src/partitiondb/domains.py",
    "src/partitiondb/operation_events.py",
]

[tool.pytest.ini_options]
markers = ["postgres: requires PARTITIONDB_TEST_DSN"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["partitiondb", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/test_django.py" = ["E402"]
"tests/test_identity_cache.py" = ["E402"]
[dependency-groups]
dev = [
    "django (>=6.1.2,<7.0.0) ; python_version >= \"3.12\"",
    "psycopg[binary] (>=3.3.6,<4.0.0)"
]
