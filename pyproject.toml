[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27,<2" ]

[project]
dependencies = [ ]
description = "Explicit PostgreSQL tenant scopes with optional framework adapters"
license = "MIT"
license-files = [ "LICENSE", "THIRD_PARTY_NOTICES" ]
name = "partitiondb"
readme = "README.md"
requires-python = ">=3.11"
version = "0.2.0a28"

  [[project.authors]]
  name = "Jonny Doyle"

  [project.optional-dependencies]
  celery = [ "celery>=5.6,<5.7" ]
  dev = [
  "celery>=5.6,<5.7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff==0.17.1",
  "mypy>=1.15,<2",
  "build>=1.2,<2"
]
  django = [ "Django>=5.2,<6.1", "psycopg[binary]>=3.2,<4" ]
  postgres = [ "psycopg[binary]>=3.2,<4" ]
  testing = [ "pytest>=8,<10" ]

[tool.hatch.build.targets.sdist]
exclude = [ "/dist", "/release_reports" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/partitiondb" ]

[tool.mypy]
files = [
  "src/partitiondb/core.py",
  "src/partitiondb/contracts.py",
  "src/partitiondb/keys.py",
  "src/partitiondb/jobs.py",
  "src/partitiondb/provisioning.py",
  "src/partitiondb/fleet.py",
  "src/partitiondb/domains.py",
  "src/partitiondb/operation_events.py"
]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
markers = [ "postgres: requires PARTITIONDB_TEST_DSN" ]
pythonpath = [ "src", "." ]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 100

  [tool.ruff.lint]
  select = [ "E", "F", "I", "B", "UP" ]

    [tool.ruff.lint.per-file-ignores]
    "tests/test_django.py" = [ "E402" ]
    "tests/test_identity_cache.py" = [ "E402" ]
