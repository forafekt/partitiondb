
name: validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        django: ['>=5.2,<5.3', '>=6.0,<6.1', '>=6.1,<6.2']
        exclude:
          - python: '3.11'
            django: '>=6.0,<6.1'
          - python: '3.11'
            django: '>=6.1,<6.2'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partitiondb
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: partitiondb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U partitiondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PARTITIONDB_TEST_DSN: postgresql://partitiondb:test-only@localhost:5432/partitiondb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'

      - run: git ls-files --error-unmatch scripts/validate.py scripts/check_artifacts.py

      - run: python -m pip install '.[django,dev]' 'Django${{ matrix.django }}'

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff formatting
        run: python -m ruff format --check .

      - run: python -m mypy

      - run: python scripts/validate.py --installed-package

      - run: python -m build

      - run: python scripts/check_artifacts.py

      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}-django-${{ strategy.job-index }}
          path: dist/


  openbao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Build the exact candidate wheel
        run: python -m build
      - name: Select the built wheel for service acceptance
        run: |
          python - <<'PYCODE'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheel = f"/package/dist/partitiondb-{version}-py3-none-any.whl"
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"PARTITIONDB_PACKAGE={wheel}\n")
          PYCODE
      - name: OpenBao and PostgreSQL acceptance against installed wheel
        run: docker compose -f compose.tests.yml --profile secrets run --rm openbao_acceptance
      - name: Stop disposable services
        if: always()
        run: docker compose -f compose.tests.yml --profile secrets down
