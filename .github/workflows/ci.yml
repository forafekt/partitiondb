name: validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        django: ['>=5.2,<5.3', '>=6.0,<6.1']
        exclude:
          - python: '3.11'
            django: '>=6.0,<6.1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partitiondb
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: partitiondb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U partitiondb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARTITIONDB_TEST_DSN: postgresql://partitiondb:test-only@localhost:5432/partitiondb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[django,dev]' 'Django${{ matrix.django }}'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python scripts/validate.py --installed-package
      - run: python -m build
