services:
  rabbitmq:
    image: rabbitmq:4
    profiles: [celery]
    environment:
      RABBITMQ_DEFAULT_USER: partitiondb
      RABBITMQ_DEFAULT_PASS: test-only
      RABBITMQ_DEFAULT_VHOST: partitiondb
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30
  celery_acceptance:
    image: python:3.12-slim
    profiles: [celery]
    init: true
    working_dir: /package
    volumes:
      - .:/package:ro
    environment:
      PARTITIONDB_PACKAGE: ${PARTITIONDB_PACKAGE:-.}
      PARTITIONDB_TEST_DSN: postgresql://partitiondb:test-only@postgres:5432/partitiondb
      PARTITIONDB_CELERY_BROKER: amqp://partitiondb:test-only@rabbitmq:5672/partitiondb
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      - sh
      - -c
      - pip install "$${PARTITIONDB_PACKAGE}[postgres,celery]" && python -m scripts.celery_acceptance
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: partitiondb
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: partitiondb
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U partitiondb']
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    image: python:3.12-slim
    working_dir: /package
    volumes:
      - .:/package:ro
    environment:
      PARTITIONDB_PACKAGE: ${PARTITIONDB_PACKAGE:-.}
      PARTITIONDB_TEST_DSN: postgresql://partitiondb:test-only@postgres:5432/partitiondb
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - pip install "$${PARTITIONDB_PACKAGE}[django,dev]" && python -m pytest --require-postgres -p no:cacheprovider
  validation:
    image: python:${PARTITIONDB_PYTHON:-3.12}-slim
    working_dir: /package
    volumes:
      - .:/package:ro
    environment:
      PARTITIONDB_PACKAGE: ${PARTITIONDB_PACKAGE:-.}
      PARTITIONDB_TEST_DSN: postgresql://partitiondb:test-only@postgres:5432/partitiondb
      PARTITIONDB_DJANGO: ${PARTITIONDB_DJANGO:->=6.0,<6.1}
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - pip install "$${PARTITIONDB_PACKAGE}[django,dev]" "Django$${PARTITIONDB_DJANGO}" && python scripts/validate.py --installed-package
  acceptance:
    build:
      context: .
      dockerfile: Dockerfile.acceptance
    working_dir: /package
    volumes:
      - .:/package:ro
    environment:
      PARTITIONDB_PACKAGE: ${PARTITIONDB_PACKAGE:-.}
      PARTITIONDB_TEST_DSN: postgresql://partitiondb:test-only@postgres:5432/partitiondb
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - pip install "$${PARTITIONDB_PACKAGE}[postgres]" && python scripts/production_checks.py
